name: TIJDELIJK PR127 preview-smoke (read-only)
on:
  push:
    branches: [ci/pr127-preview-smoke]
permissions:
  contents: read
  issues: write
  pull-requests: write
concurrency:
  group: pr127-preview-smoke
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Scan 6 approved pilot sites on PR #127 preview (public scan, one at a time)
        env:
          PREVIEW_URL: https://rankfix-app-git-feat-vercel-chromium-rendering-scoop5.vercel.app
          OUTPUT_FILE: smoke.md
          PAUSE_MS: "20000"
        run: |
          node scripts/regression/preview-smoke.mjs \
            https://www.coolblue.nl/ https://www.zalando.de/ https://www.expert.nl/ \
            https://www.acupunctuurdijkstra.nl/ https://www.transheroes.com/nl/ https://www.ikea.com/nl/nl/
      - name: Post result on PR #127
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "## Claude — automatische preview-smoke PR #127 (GitHub-runner, read-only)"; echo; cat smoke.md 2>/dev/null || echo "Geen resultaat (zie run ${{ github.run_id }})."; echo; echo "_Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} · tijdelijke branch \`ci/pr127-preview-smoke\`, wordt verwijderd._"; } > comment.md
          gh api repos/${{ github.repository }}/issues/127/comments -F body=@comment.md >/dev/null

name: RankFix CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, qa/nonprofit-identity-nature-20261019]
  workflow_dispatch:

concurrency:
  group: rankfix-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      DATABASE_URL: "postgresql://rankfix:rankfix@127.0.0.1:5432/rankfix_ci"
      SESSION_SECRET: "ci-only-session-secret-not-for-production"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Production dependency audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Tests
        run: npm test

      - name: Lint (legacy debt report)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npm run lint

      - name: Production build
        if: ${{ !cancelled() }}
        run: npm run build

      - name: Fixes browser smoke (mobile and desktop)
        if: ${{ success() }}
        run: |
          npm run start -- --hostname 127.0.0.1 -p 3100 > /tmp/rankfix-ci-browser.log 2>&1 &
          NEXT_PID=$!
          trap 'kill "$NEXT_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3100/dashboard/fixes >/dev/null; then break; fi
            sleep 1
          done
          node tests/manual/fixes-responsive.browser.mjs

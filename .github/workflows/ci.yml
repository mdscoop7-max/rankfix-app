name: RankFix CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: rankfix-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      DATABASE_URL: "postgresql://rankfix:rankfix@127.0.0.1:5432/rankfix_ci"
      SESSION_SECRET: "ci-only-session-secret-not-for-production"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Dependency audit (production and development)
        run: npm audit --audit-level=high

      - name: Tests
        run: npm test

      - name: Lint (blocking — existing debt must remain visible)
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Production build
        if: ${{ !cancelled() }}
        run: npm run build

      - name: Browser context regression (local production build, mocked APIs)
        if: ${{ success() }}
        run: node tests/ui-context-smoke.mjs

  testlab-catalog:
    name: Required 144-site catalog and baseline evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate offline dataset; missing real inputs fail closed
        run: node scripts/testlab/validate-mkb-catalog.mjs

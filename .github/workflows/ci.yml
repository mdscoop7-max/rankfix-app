name: RankFix CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: rankfix-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      DATABASE_URL: "postgresql://rankfix:rankfix@127.0.0.1:5432/rankfix_ci"
      SESSION_SECRET: "ci-only-session-secret-not-for-production"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Production dependency audit (blocking)
        run: npm audit --omit=dev --audit-level=high

      - name: Tests
        run: npm test

      - name: Lint (legacy debt; nonblocking, must be fixed separately)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npm run lint

      - name: Production build
        if: ${{ !cancelled() }}
        run: npm run build

      - name: axe-core not bundled (QA 144)
        if: ${{ success() }}
        run: node tests/manual/axe-bundle-check.mjs

      - name: axe-core in a real browser (QA 144)
        if: ${{ success() }}
        run: CHROME_EXECUTABLE_PATH="$(command -v google-chrome || command -v chromium)" node --experimental-strip-types tests/manual/axe-real-browser.browser.mjs

      - name: TestLab stop and resume in a real browser (QA 144)
        if: ${{ success() }}
        run: |
          VERCEL_ENV=preview npm run start -- --hostname 127.0.0.1 -p 3101 > /tmp/rankfix-ci-testlab.log 2>&1 &
          LAB_PID=$!
          trap 'kill "$LAB_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3101/dashboard/testlab >/dev/null; then break; fi
            sleep 1
          done
          RF_BASE=http://127.0.0.1:3101 CHROME_EXECUTABLE_PATH="$(command -v google-chrome || command -v chromium)" node tests/manual/testlab-stop-resume.browser.mjs

      - name: Fixes browser smoke (mobile and desktop)
        if: ${{ success() }}
        run: |
          npm run start -- --hostname 127.0.0.1 -p 3100 > /tmp/rankfix-ci-browser.log 2>&1 &
          NEXT_PID=$!
          trap 'kill "$NEXT_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3100/dashboard/fixes >/dev/null; then break; fi
            sleep 1
          done
          node tests/manual/fixes-responsive.browser.mjs

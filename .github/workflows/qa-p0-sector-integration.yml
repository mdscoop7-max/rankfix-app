name: QA P0 + sector integration verification
on:
  push:
    branches:
      - qa/integration-mkb-144-20261102
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reconcile-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Attempt integration in disposable checkout (never push or deploy)
        shell: bash
        run: |
          git config user.email "qa-integration@users.noreply.github.com"
          git config user.name "RankFix QA integration"
          git fetch origin fix/report-quality-generic-p1-p10-20261031
          if ! git merge --no-commit --no-ff origin/fix/report-quality-generic-p1-p10-20261031; then
            echo '### P0 + sector merge conflicts (not integrated)' >> "$GITHUB_STEP_SUMMARY"
            git diff --name-only --diff-filter=U | tee /tmp/rankfix-conflicts.txt
            cat /tmp/rankfix-conflicts.txt >> "$GITHUB_STEP_SUMMARY"
            echo 'FAIL CLOSED: resolve conflicts on the QA branch before test/build.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo '### Disposable merge clean; testing combined tree' >> "$GITHUB_STEP_SUMMARY"
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

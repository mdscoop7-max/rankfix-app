name: RankFix System Health

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    name: Run production health guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run RankFix Health Guard
        env:
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
        run: |
          if [ -z "$MONITOR_SECRET" ]; then
            echo "::error::MONITOR_SECRET is not configured in GitHub Actions."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 10 --max-time 180 \
            -H "Authorization: Bearer $MONITOR_SECRET" \
            "https://rankfix-app.onrender.com/api/internal/health/run"

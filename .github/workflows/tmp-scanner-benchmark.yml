name: TIJDELIJK scanner-benchmark PR #127 (read-only)

# Temporary test branch only (ci/pr127-preview-smoke), never merged.
# Builds the exact PR #127 commit, starts it locally on the runner with a
# throwaway PostgreSQL and the same serverless Chromium as Vercel, and runs
# real anonymous scans one at a time while measuring time, CPU and memory.
on:
  push:
    branches: [ci/pr127-preview-smoke]

permissions:
  contents: write
  issues: write

concurrency:
  group: tmp-scanner-benchmark
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # Before (PR #127) and after (fix branch), one at a time: never two scans
    # of the same site in parallel.
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        sha: [a3256c490025025ce619e9e75d56c5f2468e0706]
    env:
      PR127_SHA: ${{ matrix.sha }}
      DATABASE_URL: postgresql://rankfix:rankfix-bench@127.0.0.1:5432/rankfix_bench
      SESSION_SECRET: benchmark-only-secret-not-used-anywhere-else
      APP_URL: http://127.0.0.1:3100
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout tooling
        uses: actions/checkout@v4
      - name: Checkout PR #127 (exact commit under test)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PR127_SHA }}
          path: app127
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Throwaway PostgreSQL (runner's own, SSL on as in production config)
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "CREATE USER rankfix WITH PASSWORD 'rankfix-bench';"
          sudo -u postgres psql -c "CREATE DATABASE rankfix_bench OWNER rankfix;"
          sudo -u postgres psql -tc "SHOW ssl;"
      - name: Install and build PR #127
        working-directory: app127
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Chromium preflight (serverless Chromium as on Vercel, else system Chrome)
        working-directory: app127
        run: |
          cat > preflight.mjs <<'EOF'
          const chromium = (await import("@sparticuz/chromium")).default;
          const puppeteer = (await import("puppeteer-core")).default;
          chromium.setGraphicsMode = false;
          const browser = await puppeteer.launch({ headless: true, executablePath: await chromium.executablePath(), args: chromium.args.filter((a) => a !== "--single-process") });
          const page = await browser.newPage();
          await page.setContent("<title>ok</title>");
          console.log("serverless chromium:", await page.title(), await browser.version());
          await browser.close();
          EOF
          if timeout 90 node preflight.mjs; then
            echo "RANKFIX_SERVERLESS_CHROMIUM=1" >> "$GITHUB_ENV"
            echo "BROWSER_SOURCE=@sparticuz/chromium (zelfde als Vercel)" >> "$GITHUB_ENV"
          else
            echo "PUPPETEER_EXECUTABLE_PATH=$(which google-chrome)" >> "$GITHUB_ENV"
            echo "RANKFIX_CHROME_NO_SANDBOX=1" >> "$GITHUB_ENV"
            echo "BROWSER_SOURCE=system Chrome (fallback: serverless Chromium startte niet)" >> "$GITHUB_ENV"
          fi
      - name: Start PR #127 server
        working-directory: app127
        run: |
          nohup node node_modules/next/dist/bin/next start -p 3100 > ../server.log 2>&1 &
          echo $! > ../server.pid
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://127.0.0.1:3100/ && break; sleep 2; done
          curl -sS -o /dev/null -w "home %{http_code}\n" http://127.0.0.1:3100/
      - name: Quality gates (tests, lint, build already done)
        if: ${{ !startsWith(matrix.sha, 'b2a8280') }}
        working-directory: app127
        run: |
          set +e
          mkdir -p ../benchmark-results/quality-${PR127_SHA:0:7}
          npm test > ../benchmark-results/quality-${PR127_SHA:0:7}/test.txt 2>&1; echo "npm test exit $?" >> ../benchmark-results/quality-${PR127_SHA:0:7}/summary.txt
          npm run lint > ../benchmark-results/quality-${PR127_SHA:0:7}/lint.txt 2>&1; echo "npm run lint exit $?" >> ../benchmark-results/quality-${PR127_SHA:0:7}/summary.txt
          tail -5 ../benchmark-results/quality-${PR127_SHA:0:7}/lint.txt >> ../benchmark-results/quality-${PR127_SHA:0:7}/summary.txt
          grep -E "^# (tests|pass|fail)" ../benchmark-results/quality-${PR127_SHA:0:7}/test.txt >> ../benchmark-results/quality-${PR127_SHA:0:7}/summary.txt || true
          echo "npm run build: success (step 'Install and build')" >> ../benchmark-results/quality-${PR127_SHA:0:7}/summary.txt
      - name: Real scans, one at a time, measured
        if: ${{ !startsWith(matrix.sha, 'b2a8280') }}
        run: |
          mkdir -p benchmark-results
          SERVER_PID=$(cat server.pid) BASE_URL=http://127.0.0.1:3100 PAUSE_MS=15000 DUMP_DIR=benchmark-results/raw-${PR127_SHA:0:7} \
            node --experimental-strip-types scripts/regression/local-scan-benchmark.mjs \
            ${SITES_FILE:-scripts/regression/benchmark-sites.json} benchmark-results/bench.json
          touch benchmark-results/.ran-bench
      - name: UI screenshots desktop + mobile
        continue-on-error: true
        run: |
          CHROME_PATH=$(which google-chrome) APP_DIR=app127 BASE_URL=http://127.0.0.1:3100 OUT_DIR=benchmark-results/ui-${PR127_SHA:0:7} \
            node scripts/regression/ui-screenshots.mjs
      - name: Report
        if: ${{ always() && !startsWith(matrix.sha, 'b2a8280') }}
        run: |
          errors=$(grep -c "RankFix scan failed" server.log || true)
          renderfail=$(grep -ci "render failed\|BROWSER_UNAVAILABLE" server.log || true)
          node scripts/regression/benchmark-report.mjs benchmark-results/bench.json benchmark-results/report.md \
            "Code onder test: \`${PR127_SHA:0:7}\` · lokaal gestart op GitHub-runner (ubuntu, Node 24) met lege wegwerp-database · browser: ${BROWSER_SOURCE} · anonieme publieke scan, 1 tegelijk, 15 s pauze · serverlog: ${errors} interne scanfouten, ${renderfail} render-meldingen"
          grep -iE "scan failed|render failed|BROWSER_UNAVAILABLE|error" server.log | head -60 > benchmark-results/server-errors.txt || true
      - name: Save results on this temporary branch
        if: always()
        run: |
          git config user.name "rankfix-benchmark"
          git config user.email "noreply@github.com"
          git add -f benchmark-results/ui-${PR127_SHA:0:7} || true
          if [ -f benchmark-results/.ran-bench ]; then
            cp benchmark-results/bench.json benchmark-results/bench-${PR127_SHA:0:7}.json; cp benchmark-results/report.md benchmark-results/report-${PR127_SHA:0:7}.md
            git add -f benchmark-results/raw-${PR127_SHA:0:7} benchmark-results/bench-${PR127_SHA:0:7}.json benchmark-results/report-${PR127_SHA:0:7}.md
          fi
          git add -f benchmark-results/quality-${PR127_SHA:0:7} 2>/dev/null || true
          git commit -m "Benchmark results ${GITHUB_RUN_ID}" || exit 0
          git stash -u -q || true
          ok=0; for i in 1 2 3; do git pull --rebase -q origin ci/pr127-preview-smoke && git push origin HEAD:ci/pr127-preview-smoke && ok=1 && break; sleep 5; done
          [ "$ok" = 1 ] || { echo "::error::results push failed"; exit 1; }

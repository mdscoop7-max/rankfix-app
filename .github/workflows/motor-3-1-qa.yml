name: Motor 3.1 QA
on:
  push:
    branches:
      - fix/motor-3-1-identity-conflict-qa-20261014
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Sector Motor regression tests
        run: npm test
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
